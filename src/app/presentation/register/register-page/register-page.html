<div id="register">
	<form id="register-form">
		<label for="email" class="input-label">Email</label>
		<input type="email" id="email" name="email" #email autocomplete="email">
		<label for="first-name" class="input-label">Fornavn</label>
		<input type="text" id="first-name" name="first-name" #firstName autocomplete="given-name">
		<label for="last-name" class="input-label">Efternavn</label>
		<input type="text" id="last-name" name="last-name" #lastName autocomplete="family-name">
		<label for="password" class="input-label">Adgangskode</label>
		<div class="password-input-container">
			<input type="password" id="password" name="password" #password autocomplete="new-password">
			<app-hide-password-toggle [target]="password"></app-hide-password-toggle>
		</div>
		<label for="confirm-password" class="input-label">Bekræft adgangskode</label>
		<div class="password-input-container">
			<input type="password" id="confirm-password" name="confirm-password" #confirmPassword autocomplete="new-password">
			<app-hide-password-toggle [target]="confirmPassword"></app-hide-password-toggle>
		</div>
		<p id="login-text">har du allerede en konto? <a href="/login">Log ind her</a></p>
		<button type="button" id="register-button" (click)="register(email.value, firstName.value, lastName.value, password.value, role.value)">Opret</button>
		<input type="hidden" #role value="user">
	</form>
</div>
